[pytest]
# Default run = unit tier only (fast, no docker, no GPU). The integration and
# live tiers are opted into explicitly:
#   pytest tests/integration -m integration   (needs the docker test stack)
#   pytest tests/live -m live                 (needs RAG_URL pointing at a live stack)
addopts = -m "not integration and not live"
testpaths = tests
markers =
    integration: requires the docker test stack (tests/integration/docker-compose.test.yml)
    live: requires a running LLM-backed stack (RAG_URL env var)
