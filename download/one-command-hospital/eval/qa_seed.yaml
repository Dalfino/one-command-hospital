# Known-answer eval set (52 pairs: 42 traced + 10 refusal traps; target 200 by Phase 1 exit).
# Each answerable item is traced to a corpus id + section; the runner scores
# (a) retrieval hit rate, (b) citation validity, (c) refusal correctness.
# Improvement #5: the hospital AI gets an automatic exam before it ships.

questions:
  # ── ANTICOAG-BRIDGE v3.0 ─────────────────────────────────────────────
  - id: a01
    question: "How many days before elective surgery should warfarin be interrupted?"
    expected_corpus: ANTICOAG-BRIDGE
    expected_section: "3"
    must_contain: ["5 days"]
  - id: a02
    question: "Does a low-risk patient with atrial fibrillation need bridging before a minor procedure?"
    expected_corpus: ANTICOAG-BRIDGE
    expected_section: "3"
    must_contain: ["no bridging"]
  - id: a03
    question: "Which patients are classified as high thromboembolic risk in our bridging protocol?"
    expected_corpus: ANTICOAG-BRIDGE
    expected_section: "2"
    must_contain: ["mechanical mitral valve"]
  - id: a04
    question: "What INR threshold must be met before the procedure proceeds?"
    expected_corpus: ANTICOAG-BRIDGE
    expected_section: "4"
    must_contain: ["1.5"]
  - id: a05
    question: "What should be given if INR is 1.8 on the day before surgery?"
    expected_corpus: ANTICOAG-BRIDGE
    expected_section: "4"
    must_contain: ["vitamin K"]
  - id: a06
    question: "When can warfarin be resumed after a minor procedure with adequate haemostasis?"
    expected_corpus: ANTICOAG-BRIDGE
    expected_section: "5"
    must_contain: ["12"]
  - id: a07
    question: "How long is therapeutic anticoagulation delayed after a high-bleed-risk procedure?"
    expected_corpus: ANTICOAG-BRIDGE
    expected_section: "5"
    must_contain: ["48"]
  - id: a08
    question: "Is bridging required for a patient with a mechanical mitral valve?"
    expected_corpus: ANTICOAG-BRIDGE
    expected_section: "6"
    must_contain: ["bridging is required"]
  - id: a09
    question: "When is the last pre-operative LMWH dose given?"
    expected_corpus: ANTICOAG-BRIDGE
    expected_section: "3"
    must_contain: ["24 hours"]
  - id: a10
    question: "Who should be contacted when there is uncertainty about the bridging plan?"
    expected_corpus: ANTICOAG-BRIDGE
    expected_section: "7"
    must_contain: ["anticoagulation stewardship pharmacist"]
  - id: a11
    question: "How far ahead of theatre should warfarin be stopped for an elective case?"
    expected_corpus: ANTICOAG-BRIDGE
    expected_section: "3"
    must_contain: ["5 days"]
  - id: a12
    question: "A patient with a mechanical mitral valve is listed for colonoscopy — do they need a bridging plan?"
    expected_corpus: ANTICOAG-BRIDGE
    expected_section: "6"
    must_contain: ["bridging is required"]
  - id: a13
    question: "What is the warfarin restart plan after a high-bleed-risk operation?"
    expected_corpus: ANTICOAG-BRIDGE
    expected_section: "5"
    must_contain: ["48"]
  - id: a14
    question: "INR is 1.7 the afternoon before theatre — what does the protocol say to do?"
    expected_corpus: ANTICOAG-BRIDGE
    expected_section: "4"
    must_contain: ["vitamin K"]
  # ── SEPSIS-SCR ed.2 ─────────────────────────────────────────────────
  - id: s01
    question: "How often are inpatients screened for sepsis?"
    expected_corpus: SEPSIS-SCR
    expected_section: "2"
    must_contain: ["shift"]
  - id: s02
    question: "What are the qSOFA components used in our screening protocol?"
    expected_corpus: SEPSIS-SCR
    expected_section: "2"
    must_contain: ["22"]
  - id: s03
    question: "How quickly must the responding team be notified after a positive sepsis screen?"
    expected_corpus: SEPSIS-SCR
    expected_section: "3"
    must_contain: ["15 minutes"]
  - id: s04
    question: "How soon is senior clinical review required after a positive screen?"
    expected_corpus: SEPSIS-SCR
    expected_section: "3"
    must_contain: ["30 minutes"]
  - id: s05
    question: "How many blood culture sets are taken before antibiotics in the first-hour bundle?"
    expected_corpus: SEPSIS-SCR
    expected_section: "4"
    must_contain: ["two sets"]
  - id: s06
    question: "What is the antibiotic administration target in the first-hour bundle?"
    expected_corpus: SEPSIS-SCR
    expected_section: "4"
    must_contain: ["60 minutes"]
  - id: s07
    question: "What fluid volume is used for hypotension or lactate at or above 4 mmol/L?"
    expected_corpus: SEPSIS-SCR
    expected_section: "4"
    must_contain: ["30 mL/kg"]
  - id: s08
    question: "When should lactate be repeated after the initial measurement?"
    expected_corpus: SEPSIS-SCR
    expected_section: "4"
    must_contain: ["2 hours"]
  - id: s09
    question: "Who audits sepsis screening documentation and how often?"
    expected_corpus: SEPSIS-SCR
    expected_section: "5"
    must_contain: ["monthly"]
  - id: s10
    question: "Who do we escalate to if a ward has no resident senior cover?"
    expected_corpus: SEPSIS-SCR
    expected_section: "3"
    must_contain: ["on-call medical registrar"]
  - id: s11
    question: "Respiratory rate 24, systolic 95, newly confused — does this screen positive for sepsis?"
    expected_corpus: SEPSIS-SCR
    expected_section: "2"
    must_contain: ["qSOFA"]
  - id: s12
    question: "How quickly must antibiotics be administered after a positive sepsis screen?"
    expected_corpus: SEPSIS-SCR
    expected_section: "4"
    must_contain: ["60 minutes"]
  - id: s13
    question: "Lactate is 4.5 mmol/L — what does the first-hour bundle require?"
    expected_corpus: SEPSIS-SCR
    expected_section: "4"
    must_contain: ["30 mL/kg"]
  - id: s14
    question: "There is no resident senior doctor on my ward — who reviews a positive screen?"
    expected_corpus: SEPSIS-SCR
    expected_section: "3"
    must_contain: ["on-call medical registrar"]
  # ── GLYCEMIC-CTRL v1.0 ──────────────────────────────────────────────
  - id: g01
    question: "What is the capillary glucose target range for most general inpatients?"
    expected_corpus: GLYCEMIC-CTRL
    expected_section: "2"
    must_contain: ["7.8"]
  - id: g02
    question: "How often should blood glucose be checked in insulin-treated ward patients?"
    expected_corpus: GLYCEMIC-CTRL
    expected_section: "3"
    must_contain: ["four"]
  - id: g03
    question: "What is the rule of 15 for treating hypoglycemia?"
    expected_corpus: GLYCEMIC-CTRL
    expected_section: "4"
    must_contain: ["15 g"]
  - id: g04
    question: "How soon after treating hypoglycemia should glucose be rechecked?"
    expected_corpus: GLYCEMIC-CTRL
    expected_section: "4"
    must_contain: ["15 minutes"]
  - id: g05
    question: "How is hypoglycemia treated in a drowsy patient who cannot swallow?"
    expected_corpus: GLYCEMIC-CTRL
    expected_section: "4"
    must_contain: ["glucagon"]
  - id: g06
    question: "What glucose value defines inpatient hypoglycemia?"
    expected_corpus: GLYCEMIC-CTRL
    expected_section: "4"
    must_contain: ["4.0"]
  - id: g07
    question: "Who is contacted for two or more hypoglycemia episodes in 24 hours out of hours?"
    expected_corpus: GLYCEMIC-CTRL
    expected_section: "5"
    must_contain: ["on-call medical registrar"]
  - id: g08
    question: "At what glucose level should ketones be checked?"
    expected_corpus: GLYCEMIC-CTRL
    expected_section: "3"
    must_contain: ["14"]
  - id: g09
    question: "Is metformin taken on the morning of surgery?"
    expected_corpus: GLYCEMIC-CTRL
    expected_section: "6"
    must_contain: ["omit"]
  - id: g10
    question: "What is the relaxed glucose target for frail or end-of-life patients?"
    expected_corpus: GLYCEMIC-CTRL
    expected_section: "2"
    must_contain: ["13.9"]
  - id: g11
    question: "Where must every hypoglycemia episode be recorded?"
    expected_corpus: GLYCEMIC-CTRL
    expected_section: "4"
    must_contain: ["hypoglycemia chart"]
  - id: g12
    question: "When is an insulin infusion considered on the general ward?"
    expected_corpus: GLYCEMIC-CTRL
    expected_section: "5"
    must_contain: ["infusion"]
  - id: g13
    question: "What happens to SGLT2 inhibitor tablets around the day of surgery?"
    expected_corpus: GLYCEMIC-CTRL
    expected_section: "6"
    must_contain: ["3 days"]
  - id: g14
    question: "How often is glucose checked once an insulin infusion is stable?"
    expected_corpus: GLYCEMIC-CTRL
    expected_section: "3"
    must_contain: ["1–2 hourly"]
  # ── Refusal cases (correct behavior = NOT_COVERED) ──────────────────
