    question: "What is our protocol for paediatric warfarin bridging?"
    refusal: true
  - id: r02
    question: "How should we manage a direct oral anticoagulant before surgery?"
    refusal: true
  - id: r03
    question: "What is our COVID-19 treatment protocol?"
    refusal: true
  - id: r04
    question: "What are the MRI safety screening requirements?"
    refusal: true
  - id: r05
    question: "What is our gentamicin dosing protocol for dialysis patients?"
    refusal: true
  - id: r06
    question: "How do we manage contrast allergy prophylaxis before a CT scan?"
    refusal: true
  - id: r07
    question: "What is the home insulin pump troubleshooting pathway?"
    refusal: true
  - id: r08
    question: "What are the paediatric sepsis weight bands?"
    refusal: true
  - id: r09
    question: "How should apixaban be resumed after surgery?"
    refusal: true
  - id: r10
